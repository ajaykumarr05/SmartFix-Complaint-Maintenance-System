
spring.application.name=smartfix
server.port=${PORT:8080}

# Database connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartfix_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Demo accounts
app.demo.admin-email=${DEMO_ADMIN_EMAIL:admin@smartfix.com}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD}
app.demo.technician-email=${DEMO_TECH_EMAIL:tech@smartfix.com}
app.demo.technician-password=${DEMO_TECH_PASSWORD}
